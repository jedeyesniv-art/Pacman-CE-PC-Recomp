# Pac-Man CE codegen config for ReXGlue (included from pacman_manifest.toml).
# Carried over from the XenonRecomp config (config\pacman.toml); see CLAUDE.md for how each was found.
# Save/restore helpers are detected by ReXGlue itself.

# MSVC CRT setjmp / longjmp. The SEH hook setjmp checks (0x821F6330) is never set, so the plain path is used.
setjmp_address = 0x8215BDB0
longjmp_address = 0x8215BC90

# Functions containing jump tables that analysis ended too early.
[functions]
0x82196C68 = { size = 0x188 } # switch at 82196C84 - leaf fn, checked
0x8219C030 = { size = 0x194 } # switch at 8219C03C - start corrected by hand
0x8219D878 = { size = 0x94 }  # switch at 8219D898 - leaf fn, checked
0x820AB008 = { size = 0x124 } # switch at 820AB01C - between .pdata fns 820AAF70 and 820AB130
0x820EE348 = { size = 0x150 } # switch at 820EE3CC - after padding at 820EE344, runs to .pdata fn 820EE498
# Leaf function reached only by a this-adjusting thunk (b from 8208972C); ReXGlue's analysis missed it.
0x8208A000 = { size = 0x28 }

# Spin-wait backoff (src/spin_hooks.cpp). On the Xbox these loops each had a hardware thread to
# themselves; on a PC they each pin a core. The hooks only add a pause / short sleep while idle.

# Job workers 1-3 (sub_8213ED08 / sub_8213EDE0 / sub_8213EEB8) poll their control word for state 1
# (job handed out) with no delay. Hooked at the "bne" taken when there is no job; r11 = state.
[[midasm_hook]]
address = 0x8213ED54
name = "WorkerPollHook"
registers = ["r11"]

[[midasm_hook]]
address = 0x8213EE2C
name = "WorkerPollHook"
registers = ["r11"]

[[midasm_hook]]
address = 0x8213EF04
name = "WorkerPollHook"
registers = ["r11"]

# D3D's GPU wait poll (sub_82065018, called in a loop by sub_8206F728): a few delay hints, then a check of
# the GPU's progress. Hooked after the delay loop, once per poll.
[[midasm_hook]]
address = 0x8206506C
name = "GpuWaitPollHook"

# Per-frame CPU/GPU handshake (src/spin_hooks.cpp). D3D's swap code (sub_82067570) emits two PM4
# WAIT_REG_MEM packets that wait for a memory word set by the CPU side, with wait = 0x100. ReXGlue's command
# processor sleeps wait/0x100 ms per failed check (Windows Sleep(1), often longer), enough to miss a vblank
# with every thread idle. Hooked on the stores of the wait field; r4 / r6 = wait.
[[midasm_hook]]
address = 0x82067620
name = "GpuHandshakeWaitHook"
registers = ["r4"]

[[midasm_hook]]
address = 0x820676F0
name = "GpuHandshakeWaitHook"
registers = ["r6"]

# Not hooked: the swap path's flip wait (sub_82067838, conditional on r24 & 4) - WAIT_REG_MEM on GPU register
# 0x1973 bit 0, wait = 0x100 in r15, stored at 0x8206792C. Giving it wait 0xFF made play worse (2026-10-20):
# below 0x100 the command processor skips PrepareForWait(), which submits queued work to the host GPU.
# The other WAIT_REG_MEM builders (sub_8206F3A8, sub_8207A500, sub_8207BA40, sub_8207D7C0) use wait = 8.

# D3D command buffer size (src/spin_hooks.cpp). D3D's ring-buffer setup (sub_82070038) reads
# D3DRING_BUFFER_PARAMETERS: +12 secondary (command buffer) size, default 2 MB; +20 segment count, default 32
# (64 KB segments). In heavy scenes a frame's commands overflow the free part of 2 MB while the GPU is still
# parked on the previous frame's flip, so the CPU stalls mid-frame in sub_8206EAD8 waiting for the GPU's
# read position (status block +4) and misses the next vblank. Hooked just after the size default
# (r25 = size, r11 = segment count) to enlarge the buffer, keeping 64 KB segments.
[[midasm_hook]]
address = 0x8207013C
name = "CommandBufferSizeHook"
registers = ["r25", "r11"]

# D3D wait timing (src/frame_stats.cpp): the slow paths of the two waits a frame can stall in.
# Command buffer full - sub_8206EAD8 waits for the GPU's read position to pass the space being reused.
[[midasm_hook]]
address = 0x8206EB18
name = "BufferWaitBeginHook"

[[midasm_hook]]
address = 0x8206EB60
name = "BufferWaitEndHook"

# Fence wait - sub_8206F728 waits for the GPU to reach a fence (e.g. the frame-throttling fence at
# device+14788 when a new command segment starts).
[[midasm_hook]]
address = 0x8206F79C
name = "FenceWaitBeginHook"

[[midasm_hook]]
address = 0x8206F7DC
name = "FenceWaitEndHook"

# Vblank-interrupt timing (src/frame_stats.cpp): entry of the game's graphics interrupt callback
# sub_8206ED50; r3 = source (0 = vblank, which is also when the game flips the front buffer).
[[midasm_hook]]
address = 0x8206ED50
name = "InterruptHook"
registers = ["r3"]

# Frame-time monitor (src/frame_stats.cpp): the game's only VdSwap call (bl 0x821BAD0C), once per frame.
[[midasm_hook]]
address = 0x82067C64
name = "FrameHook"

# Padding words to skip rather than treat as code.
[[invalid_instructions]]
data = 0x00000000
size = 4
